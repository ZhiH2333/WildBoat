services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: 0.0.0.0:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      DATABASE_URL: postgres://${POSTGRES_USER:-wildboat}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wildboat}?sslmode=disable
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:?set TOKEN_SIGNING_KEY}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      EMAIL_MODE: ${EMAIL_MODE:-dev}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
      AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-1m}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - wildboat-private

  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wildboat}
      POSTGRES_USER: ${POSTGRES_USER:-wildboat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wildboat} -d ${POSTGRES_DB:-wildboat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildboat-private
    # Localhost-only publish for host-side integration tests. Do not publish publicly in production.
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:

networks:
  wildboat-private:
    driver: bridge
